
name: Deploy Worker ke 12 Akun Cloudflare

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Akun ${{ matrix.nomor }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 4

      matrix:
        include:
          - nomor: "01"
            token: "cfat_of5jiDXBLjB9WrXaUqJpPKYEyuAyeNKAmFL7hvOw0beb98a6"
            account: "3c94a69361b69d81b49df5a2fb732018"


    env:
      CLOUDFLARE_API_TOKEN: ${{ matrix.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ matrix.account }}

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Setup Node.js tanpa cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Validasi konfigurasi
      - name: Validate Configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CLOUDFLARE_API_TOKEN" == MASUKKAN_* ]] || [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Token akun ${{ matrix.nomor }} belum diisi"
            exit 1
          fi

          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Account ID akun ${{ matrix.nomor }} tidak valid"
            exit 1
          fi

          if [[ ! -f wrangler.toml && \
                ! -f wrangler.jsonc && \
                ! -f wrangler.json ]]; then
            echo "::error::File konfigurasi Wrangler tidak ditemukan"
            exit 1
          fi

          echo "Validasi akun berhasil"

      # Install Wrangler
      - name: Install Wrangler
        run: npm install --global wrangler@4

      # Periksa Wrangler
      - name: Check Wrangler
        run: wrangler --version

      # Deploy dengan retry
      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail

          CONFIG=""

          if [[ -f wrangler.toml ]]; then
            CONFIG="wrangler.toml"
          elif [[ -f wrangler.jsonc ]]; then
            CONFIG="wrangler.jsonc"
          else
            CONFIG="wrangler.json"
          fi

          for attempt in 1 2 3; do
            echo "Deploy akun ${{ matrix.nomor }}"
            echo "Percobaan $attempt dari 3"

            if wrangler deploy --config "$CONFIG"; then
              echo "Deployment berhasil"
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Deployment akun ${{ matrix.nomor }} gagal"
          exit 1

      # Laporan
      - name: Deployment Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Cloudflare Deployment"
            echo ""
            echo "| Detail | Hasil |"
            echo "|---|---|"
            echo "| Akun | ${{ matrix.nomor }} |"
            echo "| Status | $STATUS |"
            echo "| Commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"
