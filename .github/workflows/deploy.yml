
name: Deploy Worker ke 12 Akun Cloudflare

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Akun ${{ matrix.nomor }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 4

      matrix:
        include:
       
          - nomor: "01"
            token_secret: cfat_of5jiDXBLjB9WrXaUqJpPKYEyuAyeNKAmFL7hvOw0beb98a6
            account_var: 3c94a69361b69d81b49df5a2fb732018


        

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets[matrix.token] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars[matrix.account] }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Validate Configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Token akun ${{ matrix.nomor }} belum tersedia"
            exit 1
          fi

          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Account ID akun ${{ matrix.nomor }} tidak valid"
            exit 1
          fi

          if [[ ! -f wrangler.toml && \
                ! -f wrangler.jsonc && \
                ! -f wrangler.json ]]; then
            echo "::error::File konfigurasi Wrangler tidak ditemukan"
            exit 1
          fi

          echo "Validasi akun berhasil"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Check Wrangler
        run: wrangler --version

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Deploy akun ${{ matrix.nomor }} - percobaan $attempt"

            if wrangler deploy; then
              echo "Deployment berhasil"
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Deployment gagal setelah 3 percobaan"
          exit 1

      - name: Deployment Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Cloudflare Deployment"
            echo ""
            echo "| Detail | Hasil |"
            echo "|---|---|"
            echo "| Akun | ${{ matrix.nomor }} |"
            echo "| Status | $STATUS |"
            echo "| Commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"
