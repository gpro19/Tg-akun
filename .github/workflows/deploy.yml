            token: "isi_token_akun_12_disini"
            id_akun: "isi_id_akun_12_disini"

    name: Deploy ke Cloudflare Akun ${{ matrix.nomor }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Worker via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ matrix.token }}
          accountId: ${{ matrix.id_akun }}
          command: deploy
